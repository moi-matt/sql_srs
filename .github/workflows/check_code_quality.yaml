name: check_code_quality
on: pull_request
jobs: 
  pylint:
  runs-on: ubuntu-20.04
  steps:
    - uses: actions/checkout@v3
    - uses: actions/python
      with:
        python-version: 3.13
    - run: |
        python -m pip install --upgrade pip
        pip install pylint
    - run: |
        pylint app.py